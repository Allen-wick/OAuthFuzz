[main]
securityManager = org.apache.shiro.web.mgt.DefaultWebSecurityManager

[users]
user1 = pass1, user
user2 = pass2, user
admin = admin, admin
alice = alice, user

[roles]
user = read, write
admin = *

[urls]
/login = anon
/health = anon
/oauth2/token = anon
/oauth2/introspect = anon
/oauth2/revoke = anon
/.well-known/** = anon
/oauth2/authorize = authc
/oauth2/userinfo = authc
