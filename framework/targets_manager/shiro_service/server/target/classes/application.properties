server.port=8080
server.host=0.0.0.0

# OAuth2 configuration
oauth2.authorization_code.expiry=300
oauth2.access_token.expiry=3600
oauth2.refresh_token.expiry=86400

# PKCE support
oauth2.pkce.enabled=true
oauth2.pkce.methods=plain,S256

# Test users
oauth2.users.user1.password=pass1
oauth2.users.user2.password=pass2
oauth2.users.admin.password=admin
oauth2.users.alice.password=alice

# Test clients
oauth2.clients.test-client.secret=test-secret
oauth2.clients.test-client.redirect_uris=http://127.0.0.1:8080/callback,http://localhost:8080/callback
oauth2.clients.test-client.scopes=openid,profile,email,read,write

oauth2.clients.fuzz-client.secret=fuzz-secret
oauth2.clients.fuzz-client.redirect_uris=http://127.0.0.1:7777/callback,http://localhost:7777/callback
oauth2.clients.fuzz-client.scopes=openid,profile,email,read,write
