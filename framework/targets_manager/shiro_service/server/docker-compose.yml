version: '3.8'
services:
  shiro-oauth:
    build: .
    container_name: shiro-oauth-fuzz
    ports:
      - "8080:8080"
      - "6300:6300"
    volumes:
      - ../shiro_config:/app/config
      - ../shiro_work:/app/work
    environment:
      - SHIRO_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
